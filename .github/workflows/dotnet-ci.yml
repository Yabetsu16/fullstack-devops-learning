name: .NET CI

on:
    push:
        branches: ["master"]
    pull_request:
        branches: ["master"]

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: "10.0.x"

            - name: Restore dependencies
              run: dotnet restore ./Portfolio.Api.Tests/Portfolio.Api.Tests.csproj

            - name: Build projects
              run: dotnet build ./Portfolio.Api.Tests/Portfolio.Api.Tests.csproj --no-restore

            - name: Run unit tests
              run: >
                  dotnet test ./Portfolio.Api.Tests/Portfolio.Api.Tests.csproj 
                  --no-build 
                  --logger "trx;LogFileName=test-results.trx"
                  --results-directory ./TestResults
                  --verbosity normal

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: dotnet-test-results
                  path: ./TestResults/*.trx
                  if-no-files-found: ignore
                  retention-days: 7
